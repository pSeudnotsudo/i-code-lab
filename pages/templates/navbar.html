<!-- navbar.html - Django Template Component -->



{% load static %}

<nav class="navbar">
    <div class="nav-container">
        <a href="/" class="logo">
            <img src="{% static 'images/i-code_logo_v2.png' %}" alt="I-CODE Logo" style="height: 50px; width: 120px;" />
        </a>

        <!-- Hamburger Button (mobile only) -->
        <button class="nav-hamburger" id="navHamburger" aria-label="Toggle navigation" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Mobile Overlay -->
        <div class="nav-overlay" id="navOverlay"></div>

        <!-- Nav Menu -->
        <div class="nav-menu" id="navMenu">
            <ul class="nav-links">
                <li><a href="{% url 'index' %}">Home</a></li>
                <li><a href="{% url 'programs' %}">Programs</a></li>
                <li><a href="{% url 'pricing' %}">Pricing</a></li>
                <li><a href="{% url 'about' %}">About Us</a></li>
                <li><a href="{% url 'socials' %}">Gallery</a></li>
            </ul>
            <div class="nav-auth">
                {% if user.is_authenticated %}
                    <span class="nav-greeting">Hi, {{ user.username }}</span>
                    <a href="{% url 'logout' %}" class="btn-signup">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn-login">Login</a>
                    <a href="{% url 'enrollment_store' %}" class="btn-signup">Enroll Now!</a>
                    
                    <!--<a href="https://docs.google.com/forms/d/e/1FAIpQLScf93on5X9wekHlI8Ws3uIXTGkgHGX5SBRS5t_7cjd5Dr6akg/viewform?usp=sharing&ouid=116472226513210841775" target="_blank" class="btn-signup">Sign Up</a>-->
                {% endif %}
            </div>
        </div>
    </div>
</nav>

<style>
/* ─── Reset & Base ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }


:root {
    --primary-teal: #0d9488;
    --white: #ffffff;
    --shadow-sm: 0 1px 4px rgba(0,0,0,0.10);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.15);
}

/* ─── Navbar ─── */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: white;
    z-index: 1000;
    padding: 1rem 0;
    box-shadow: var(--shadow-sm);
}

.nav-container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

/* ─── Logo ─── */
.logo {
    font-size: 1.75rem;
    font-weight: 800;
    color: var(--white);
    text-decoration: none;
    letter-spacing: 0.5px;
    transition: transform 0.3s ease;
    display: flex;
    align-items: center;
    flex-shrink: 0;
    z-index: 1100;
}

.logo:hover {
    transform: scale(1.05);
}

.logo img {
    display: block;
    height: 50px;
    width: 120px;
    object-fit: contain;
}

/* ─── Nav Menu (desktop wrapper) ─── */
.nav-menu {
    display: flex;
    align-items: center;
    gap: 2.5rem;
}

/* ─── Nav Links ─── */
.nav-links {
    display: flex;
    list-style: none;
    gap: 2.5rem;
    align-items: center;
}

.nav-links a {
    color: var(--primary-teal);
    text-decoration: none;
    font-weight: 500;
    font-size: 0.95rem;
    transition: all 0.3s ease;
    position: relative;
}

.nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--primary-teal);
    transition: width 0.3s ease;
}

.nav-links a:hover::after {
    width: 100%;
}

/* ─── Auth ─── */
.nav-auth {
    display: flex;
    gap: 1rem;
    align-items: center;
}

.nav-greeting {
    color: var(--primary-teal);
    font-weight: 500;
    font-size: 0.95rem;
    white-space: nowrap;
}

.btn-login {
    padding: 0.6rem 1.75rem;
    background: var(--white);
    color: var(--primary-teal);
    text-decoration: none;
    border: 2px solid var(--primary-teal);
    border-radius: 50px;
    font-weight: 600;
    font-size: 0.9rem;
    transition: all 0.3s ease;
    box-shadow: var(--shadow-sm);
    white-space: nowrap;
}

.btn-login:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border: none;
}

.btn-signup {
    padding: 0.6rem 1.75rem;
    background: var(--primary-teal);
    color: var(--white);
    text-decoration: none;
    border: 2px solid var(--white);
    border-radius: 50px;
    font-weight: 600;
    font-size: 0.9rem;
    transition: all 0.3s ease;
    white-space: nowrap;
}

.btn-signup:hover {
    background: var(--white);
    color: var(--primary-teal);
    transform: translateY(-2px);
}

/* ─── Hamburger Button ─── */
.nav-hamburger {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    width: 44px;
    height: 44px;
    padding: 8px;
    background: none;
    border: none;
    cursor: pointer;
    z-index: 1100;
    border-radius: 8px;
    transition: background 0.2s;
}

.nav-hamburger:hover {
    background: rgba(13, 148, 136, 0.08);
}

.nav-hamburger span {
    display: block;
    width: 100%;
    height: 2px;
    background: var(--primary-teal);
    border-radius: 2px;
    transition: transform 0.3s ease, opacity 0.3s ease;
    transform-origin: center;
}

/* Hamburger → X animation */
.nav-hamburger.open span:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
}
.nav-hamburger.open span:nth-child(2) {
    opacity: 0;
    transform: scaleX(0);
}
.nav-hamburger.open span:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
}

/* ─── Mobile Overlay ─── */
.nav-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    z-index: 999;
    opacity: 0;
    transition: opacity 0.3s ease;
}

.nav-overlay.visible {
    opacity: 1;
}

/* ─── Responsive: Tablet & Mobile ─── */
@media (max-width: 768px) {
    .nav-hamburger {
        display: flex;
    }

    .nav-overlay {
        display: block;
        pointer-events: none;
    }

    .nav-overlay.visible {
        pointer-events: auto;
    }

    /* Slide-in drawer */
    .nav-menu {
        position: fixed;
        top: 0;
        right: 0;
        height: 100dvh;
        width: min(300px, 80vw);
        background: #ffffff;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        padding: 90px 28px 40px;
        gap: 0;
        z-index: 1050;
        transform: translateX(100%);
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: -4px 0 24px rgba(0, 0, 0, 0.12);
        overflow-y: auto;
    }

    .nav-menu.open {
        transform: translateX(0);
    }

    .nav-links {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        width: 100%;
    }

    .nav-links li {
        width: 100%;
    }

    .nav-links a {
        display: block;
        font-size: 1rem;
        padding: 12px 16px;
        width: 100%;
        border-radius: 10px;
        color: var(--primary-teal);
    }

    .nav-links a::after {
        display: none;
    }

    .nav-links a:hover {
        background: rgba(13, 148, 136, 0.08);
    }

    /* Divider between links and auth */
    .nav-auth {
        flex-direction: column;
        align-items: stretch;
        width: 100%;
        gap: 10px;
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid #e0f2f1;
    }

    .nav-greeting {
        font-size: 1rem;
        padding: 8px 0;
    }

    .btn-login,
    .btn-signup {
        text-align: center;
        padding: 0.5rem 1.5rem;
        font-size: 0.8rem;
    }
}

/* ─── Very small phones ─── */
@media (max-width: 360px) {
    .nav-container {
        padding: 0 1rem;
    }

    .logo img {
        width: 100px;
        height: 42px;
    }
}
</style>

<script>
(function () {
    const hamburger = document.getElementById('navHamburger');
    const menu = document.getElementById('navMenu');
    const overlay = document.getElementById('navOverlay');

    function openMenu() {
        menu.classList.add('open');
        hamburger.classList.add('open');
        overlay.classList.add('visible');
        hamburger.setAttribute('aria-expanded', 'true');
        document.body.style.overflow = 'hidden';
    }

    function closeMenu() {
        menu.classList.remove('open');
        hamburger.classList.remove('open');
        overlay.classList.remove('visible');
        hamburger.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
    }

    hamburger.addEventListener('click', function () {
        menu.classList.contains('open') ? closeMenu() : openMenu();
    });

    overlay.addEventListener('click', closeMenu);

    // Close on nav link click (single-page or ajax navigation)
    menu.querySelectorAll('.nav-links a').forEach(function (link) {
        link.addEventListener('click', closeMenu);
    });

    // Close on Escape key
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeMenu();
    });

    // Close menu when resizing to desktop
    window.addEventListener('resize', function () {
        if (window.innerWidth > 768) closeMenu();
    });
})();
</script>
