<div class="modal fade" id="enrollModal" tabindex="-1" aria-labelledby="enrollModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 20px; overflow: hidden;">

      <!-- Header -->
      <div class="modal-header border-0 p-0">
        <div class="modal-header-inner w-100">
          <div class="d-flex align-items-start justify-content-between">
            <div>
              <div class="modal-badge">
                <span class="modal-badge-dot"></span> Enrollments open
              </div>
              <h5 class="modal-title" id="enrollModalLabel">Join I-CODE Academy</h5>
              <p class="modal-subtitle">Fill in your details — takes less than 2 minutes</p>
            </div>
            <button type="button" class="modal-close" data-bs-dismiss="modal" aria-label="Close">✕</button>
          </div>
          <div class="modal-steps">
            <div class="modal-step done"></div>
            <div class="modal-step active"></div>
            <div class="modal-step"></div>
          </div>
        </div>
      </div>

      <!-- Scrollable body -->
      <div class="modal-body px-4 py-4">
        <form id="enrollForm"
              data-url="{{ enrollment_store_url }}"
              data-csrf="{{ csrf_token }}">
          <div class="row g-3">

            <!-- Name & Phone -->
            <div class="col-md-6">
              <label class="form-label fw-semibold small">Full Name <span class="text-danger">*</span></label>
              <input class="form-control" name="full_name" placeholder="e.g. Jane Doe" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold small">Phone <span class="text-danger">*</span></label>
              <input class="form-control" name="phone" placeholder="+254 700 000 000" required>
            </div>

            <!-- Email -->
            <div class="col-12">
              <label class="form-label fw-semibold small">Email Address <span class="text-danger">*</span></label>
              <input class="form-control" name="email" type="email" placeholder="you@example.com" required>
            </div>

            <!-- Programs -->
            <div class="col-12">
              <label class="form-label fw-semibold small">Programs <span class="text-danger">*</span></label>
              <div class="row g-2 p-3 border rounded-3 bg-white">
                {% for p in programs %}
                <div class="col-md-6">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="programs" value="{{ p.id }}" id="prog_{{ p.id }}">
                    <label class="form-check-label small" for="prog_{{ p.id }}">{{ p.name }}</label>
                  </div>
                </div>
                {% endfor %}
              </div>
            </div>

            <!-- Age Bracket & Timeline -->
            <div class="col-md-6">
              <label class="form-label fw-semibold small">Age Bracket <span class="text-danger">*</span></label>
              <select name="age_bracket" class="form-select" required>
                <option value="" disabled selected>— Select bracket —</option>
                {% for bracket in brackets %}
                <option value="{{ bracket.id }}">{{ bracket.title }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold small">Registration Timeline <span class="text-danger">*</span></label>
              <select name="registration_timeline" class="form-select" required>
                <option value="" disabled selected>— Select timeline —</option>
                {% for timeline in timelines %}
                <option value="{{ timeline.id }}">{{ timeline.title }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- Dates -->
            <div class="col-md-6">
              <label class="form-label fw-semibold small">Preferred Registration Date <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-calendar-check text-teal"></i></span>
                <input type="text" id="preferred_registration_date" name="preferred_registration_date"
                  class="form-control flatpickr-date" placeholder="Select date" autocomplete="off" required readonly>
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold small">Prospective Start Date <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-calendar2-week text-teal"></i></span>
                <input type="text" id="prospective_start_date" name="prospective_start_date"
                  class="form-control flatpickr-date" placeholder="Select date" autocomplete="off" required readonly>
              </div>
            </div>

            <!-- Customised course -->
            <div class="col-12">
              <label class="form-label fw-semibold small">Interested in a customised course? <span class="text-danger">*</span></label>
              <div class="d-flex gap-3">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="customized_course" value="yes" id="customYes" required>
                  <label class="form-check-label small" for="customYes">Yes, definitely</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="customized_course" value="no" id="customNo">
                  <label class="form-check-label small" for="customNo">No, thanks</label>
                </div>
              </div>
            </div>

            <!-- Comments -->
            <div class="col-12">
              <label class="form-label fw-semibold small">Additional Comments</label>
              <textarea class="form-control" name="comments" rows="3"
                placeholder="Any questions or special requirements..."></textarea>
            </div>

          </div><!-- /.row g-3 -->
        </form>
      </div><!-- /.modal-body -->

      <!-- Footer OUTSIDE modal-body -->
      <div class="modal-footer">
        <button type="submit" form="enrollForm" class="btn-submit" id="submitBtn">
          <i class="ti ti-send" aria-hidden="true"></i> Reserve My Child's Slot 
        </button>
        <div class="modal-privacy">
          <i class="ti ti-lock" aria-hidden="true"></i> Your data is safe and never shared
        </div>
        <div id="loader">
          <div class="spinner-border spinner-border-sm me-1"></div> Sending your enrollment...
        </div>
      </div><!-- /.modal-footer -->

    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->
